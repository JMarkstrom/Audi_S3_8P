<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audi S3 8P Owner's guides</title>
<style>
  :root, html[data-theme="light"]{
    --bg:#f3f3ef; --fg:#1c1c1c; --line:#d2d2ca; --dim:#5c5c5c;
    --panel:#fff; --link:#1a6fb5; --link-h:#0d4f86;
  }
  html[data-theme="dark"]{
    --bg:#2b2b2b; --fg:#e8e8e8; --line:#4a4a4a; --dim:#a8a8a8;
    --panel:#333; --link:#7aa9d8; --link-h:#9cc4e8;
  }
  html{color-scheme:light}
  html[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 72px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 20px}
  .top h1{margin:0;font-size:26px;font-weight:600}
  button.pill{background:var(--panel);color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
  button.pill:hover{color:var(--fg)}
  ul{margin:0;padding:0;list-style:none}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline;color:var(--link-h)}
  section{margin:0 0 28px}
  section h2{margin:0 0 8px;font-size:15px;font-weight:600}
  .actions{display:flex;gap:8px;flex:0 0 auto}
  @media print{
    @page{margin:16mm}
    :root, html[data-theme="light"], html[data-theme="dark"]{
      color-scheme:light;
      --bg:#fff; --fg:#000; --dim:#1a1a1a; --line:#000;
      --panel:#fff; --link:#000; --link-h:#000;
    }
    body{background:#fff !important;color:#000}
    .wrap{max-width:none;padding:0}
    #themeBtn, #printBtn{display:none !important}
    a{color:#000;text-decoration:none}
    h1, h2{color:#000}
  }
</style>
<script>
(function(){
  try{
    var t=localStorage.getItem("zf-theme");
    document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light");
  }catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();
</script>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>Audi S3 8P Owner's guides</h1>
<div class="actions">
<button type="button" class="pill" id="printBtn">Print</button>
<button type="button" class="pill" id="themeBtn">Dark view</button>
</div>
</div>
<section>
<h2>Maintenance</h2>
<ul>
  <li><a href="differential_service.html">Differential service</a></li>
  <li><a href="dsg_service.html">DSG service</a></li>
  <li><a href="haldex_service.html">Haldex service (with pump replacement)</a></li>
  <li><a href="compression_test.html">Compression test</a></li>
</ul>
</section>
<section>
<h2>Tuning &amp; Performance</h2>
<ul>
  <li><a href="steering_comparison.html">ZF electric power steering maps compared</a></li>
  <li><a href="thrust_bearing_upgrade.html">360° thrust bearing upgrade for the 06F 2.0T block</a></li>
</ul>
</section>
</div>
<script>
(function(){
  const btn=document.getElementById("themeBtn");
  function sync(){
    btn.textContent=document.documentElement.getAttribute("data-theme")==="light"?"Dark view":"Light view";
  }
  btn.onclick=()=>{
    const next=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("zf-theme", next); }catch(e){}
    sync();
  };
  sync();
  document.getElementById("printBtn").onclick=()=>window.print();
})();
</script>
</body>
</html>
